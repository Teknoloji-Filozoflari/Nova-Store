id = "chezmoi"
name = "chezmoi"
description = "chezmoi, dotfile ve kişisel ayarları birden fazla makinede güvenli yöneten tek ikili araçtır. Şablonlar, parola yöneticisi entegrasyonu, age/gpg ile şifreleme, arşivden içe aktarma ve kurulum betikleri sunar. Yeni makinede init+apply; chezmoi update ile güncelleme. Nova yapılandırma senkronu değildir; chezmoi ev dizininizi git deposundan uygular."
category = "productivity"
source = "https://www.chezmoi.io/"
license = "MIT"
executable = "chezmoi"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "elevated"
trust_class = "A"
install_command = ["sudo", "pacman", "-S", "--noconfirm", "chezmoi"]
install_notes = """
pacman: sudo pacman -S chezmoi
apt: sudo apt-get install chezmoi
dnf: sudo dnf install chezmoi
brew: brew install chezmoi
Resmî: https://www.chezmoi.io/install/
"""
