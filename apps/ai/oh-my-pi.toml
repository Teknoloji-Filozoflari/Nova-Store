id = "oh-my-pi"
name = "oh-my-pi"
description = "omp (oh-my-pi), Stencil Labs’ın Pi tabanlı terminal kodlama ajanıdır: 60+ model sağlayıcısı, 31+ yerleşik araç, LSP ve gerçek hata ayıklayıcı (DAP) desteği sunar. Dosya okuma/düzenleme, alt ajanlar, kod çalıştırma ve işbirliği oturumları içerir. Nova bir mağaza/başlatıcıdır; oh-my-pi projede kod yazıp düzenleyen ajanın kendisidir."
category = "ai"
source = "https://github.com/can1357/oh-my-pi"
license = "MIT"
executable = "omp"
install_method = "manual"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "none"
trust_class = "D"
install_notes = """
Resmî kurulumlar (upstream README):
Bun (önerilen, Bun >= 1.4.4): bun install -g @oh-my-pi/pi-coding-agent
Homebrew: brew install can1357/tap/omp
Kurulum betiği (ön derleme ikilisini SHA-256 ile doğrular): curl -fsSL https://omp.sh/install | sh
Nix: nix profile add github:can1357/oh-my-pi
mise: mise use -g github:can1357/oh-my-pi
Not: Nova uzak curl|sh / Bun yollarını otomatik çalıştırmaz; otomatik kurulum için desteklenen yöntemler arasında yer almaz (trust D).
Resmî: https://github.com/can1357/oh-my-pi
"""

[release]
repo = "can1357/oh-my-pi"
