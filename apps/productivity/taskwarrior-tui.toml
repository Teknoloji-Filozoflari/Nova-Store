id = "taskwarrior-tui"
name = "taskwarrior-tui"
description = "Taskwarrior için terminal kullanıcı arayüzü."
category = "productivity"
source = "https://github.com/kdheepak/taskwarrior-tui"
license = "MIT"
executable = "taskwarrior-tui"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "elevated"
trust_class = "A"
install_command = ["sudo", "pacman", "-S", "--noconfirm", "taskwarrior-tui"]
install_notes = """
pacman: sudo pacman -S taskwarrior-tui
brew: brew install taskwarrior-tui
Resmî: https://github.com/kdheepak/taskwarrior-tui
"""

[release]
repo = "kdheepak/taskwarrior-tui"
