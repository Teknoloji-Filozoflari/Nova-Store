id = "yadm"
name = "yadm"
description = "Yet Another Dotfiles Manager."
category = "productivity"
source = "https://github.com/yadm-dev/yadm"
license = "GPL-3.0"
executable = "yadm"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "elevated"
trust_class = "A"
install_command = ["sudo", "pacman", "-S", "--noconfirm", "yadm"]
install_notes = """
pacman: sudo pacman -S yadm
brew: brew install yadm
Resmî: https://github.com/yadm-dev/yadm
"""

[release]
repo = "yadm-dev/yadm"
