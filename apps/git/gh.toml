id = "gh"
name = "GitHub CLI"
description = "GitHub için resmi komut satırı aracı (PR, issue, Actions)."
category = "git"
source = "https://cli.github.com/"
license = "MIT"
executable = "gh"
install_method = "apt"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "elevated"
