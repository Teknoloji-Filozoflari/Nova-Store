id = "felix"
name = "felix"
description = "Vim tuş bağlamalı TUI dosya yöneticisi."
category = "files"
source = "https://github.com/kyoheiu/felix"
license = "MIT"
executable = "felix"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
