id = "gitoxide"
name = "gitoxide"
description = "Rust ile yazılmış hızlı Git uygulaması (gix)."
category = "git"
source = "https://github.com/Byron/gitoxide"
license = "Apache-2.0"
executable = "gix"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "elevated"
trust_class = "A"
install_command = ["sudo", "pacman", "-S", "--noconfirm", "gitoxide"]
install_notes = """
pacman: sudo pacman -S gitoxide
brew: brew install gitoxide
Çalıştırılabilir: gix
Resmî: https://github.com/Byron/gitoxide
"""

[release]
repo = "Byron/gitoxide"
