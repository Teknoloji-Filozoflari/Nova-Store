id = "updo"
name = "updo"
description = "Uyarı destekli uptime izleme CLI aracı."
category = "networking"
source = "https://github.com/Owloops/updo"
license = "MIT"
executable = "updo"
install_method = "brew"
supported_platforms = ["linux-x64", "linux-aarch64"]
