id = "dtop"
name = "dtop"
description = "Birden fazla host üzerinde Docker izleme terminal panosu."
category = "containers"
source = "https://github.com/amir20/dtop"
license = "MIT"
executable = "dtop"
install_method = "brew"
supported_platforms = ["linux-x64", "linux-aarch64"]
