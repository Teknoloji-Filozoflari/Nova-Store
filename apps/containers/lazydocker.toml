id = "lazydocker"
name = "lazydocker"
description = "Docker konteynerleri, imajları ve günlükleri için terminal arayüzü."
category = "containers"
source = "https://github.com/jesseduffield/lazydocker"
license = "MIT"
executable = "lazydocker"
install_method = "download_archive"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "user"
trust_class = "B"
version = "0.25.2"

[[artifacts]]
arch = "x86_64"
download_url = "https://github.com/jesseduffield/lazydocker/releases/download/v0.25.2/lazydocker_0.25.2_Linux_x86_64.tar.gz"
checksum = "0d9dbfc26068b218e7ed84b104748cadc6e3cf733c0afd35465306fb39b9523c"
checksum_type = "sha256"
asset_pattern = "lazydocker_{version}_Linux_x86_64.tar.gz"
checksum_asset_pattern = "checksums.txt"

[[artifacts]]
arch = "aarch64"
download_url = "https://github.com/jesseduffield/lazydocker/releases/download/v0.25.2/lazydocker_0.25.2_Linux_arm64.tar.gz"
checksum = "005c38b685aaa557e7d646d83a3dadb5024340eeed8c6a2e1949eee6f530de23"
checksum_type = "sha256"
asset_pattern = "lazydocker_{version}_Linux_arm64.tar.gz"
checksum_asset_pattern = "checksums.txt"

[release]
repo = "jesseduffield/lazydocker"
tag_prefix = "v"
asset_pattern = "lazydocker_{version}_Linux_x86_64.tar.gz"
checksum_asset_pattern = "checksums.txt"
