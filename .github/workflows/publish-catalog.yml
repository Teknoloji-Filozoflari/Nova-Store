name: Publish signed catalog

# Builds Nova-facing `store-catalog.toml` (+ `catalog.json` aggregate),
# signs with minisign when MINISIGN_SECRET_KEY is present, and uploads to a
# GitHub Release. See docs/catalog-signing.md and docs/nova-consumption.md.
#
# Nova client contract (`Nova` src/store/remote.rs):
#   releases/latest/download/store-catalog.toml
#   releases/latest/download/store-catalog.toml.minisig
#
# Required for a *signed* Release:
#   MINISIGN_SECRET_KEY — full contents of the minisign secret key file
#     matching keys/minisign.pub (must match Nova's pinned pubkey).
# When the secret is absent (forks / first setup): dry-run — build + upload
# unsigned workflow artifacts only. Private keys are never committed.

on:
  push:
    tags:
      - "catalog-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build artifacts without creating a GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  dry-run:
    name: Dry-run build (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Build store-catalog.toml + catalog.json
        run: |
          mkdir -p dist
          python3 scripts/build_store_catalog_toml.py -o dist/store-catalog.toml
          python3 scripts/build_catalog.py -o dist/catalog.json
          cp dist/catalog.json metadata/catalog.json
          python3 - <<'PY'
          from pathlib import Path
          import tomllib
          text = Path("dist/store-catalog.toml").read_bytes()
          data = tomllib.loads(text.decode("utf-8"))
          apps = data["apps"]
          assert apps, "store-catalog.toml must contain [[apps]]"
          ids = [a["id"] for a in apps]
          assert len(ids) == len(set(ids))
          print(f"dry-run store-catalog.toml ok: {len(ids)} apps, {len(text)} bytes")
          PY

      - name: Upload unsigned workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-catalog-dry-run
          path: |
            dist/store-catalog.toml
            dist/catalog.json
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Build and sign catalog
    # Tag pushes always attempt publish; workflow_dispatch respects dry_run.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y minisign

      - name: Validate catalog
        run: python3 scripts/validate_catalog.py

      - name: Build store-catalog.toml + catalog.json
        run: |
          mkdir -p dist
          python3 scripts/build_store_catalog_toml.py -o dist/store-catalog.toml
          python3 scripts/build_catalog.py -o dist/catalog.json
          cp dist/catalog.json metadata/catalog.json
          echo "Built assets:"
          ls -la dist/store-catalog.toml dist/catalog.json
          wc -c dist/store-catalog.toml

      - name: Sign with minisign (or soft dry-run)
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::notice::MINISIGN_SECRET_KEY absent — building unsigned artifacts only (no GitHub Release)."
            echo "Maintainer steps: generate/set secret matching keys/minisign.pub — see docs/catalog-signing.md"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f keys/minisign.pub ]; then
            echo "::error::keys/minisign.pub missing; cannot verify signatures"
            exit 1
          fi
          umask 077
          keyfile="${RUNNER_TEMP}/nova-store.key"
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$keyfile"
          # -W: passwordless secret key (CI). Fail loudly if the key needs a password.
          minisign -S -s "$keyfile" -W -m dist/store-catalog.toml -x dist/store-catalog.toml.minisig
          minisign -Vm dist/store-catalog.toml -p keys/minisign.pub -x dist/store-catalog.toml.minisig
          # Also sign the JSON aggregate for tooling that prefers catalog.json.
          minisign -S -s "$keyfile" -W -m dist/catalog.json -x dist/catalog.json.minisig
          minisign -Vm dist/catalog.json -p keys/minisign.pub -x dist/catalog.json.minisig
          rm -f "$keyfile"
          echo "Signed assets:"
          ls -la dist/store-catalog.toml dist/store-catalog.toml.minisig \
                 dist/catalog.json dist/catalog.json.minisig
          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "mode=signed" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: store-catalog-${{ steps.sign.outputs.mode }}
          path: |
            dist/store-catalog.toml
            dist/store-catalog.toml.minisig
            dist/catalog.json
            dist/catalog.json.minisig
          if-no-files-found: warn
          retention-days: 14

      - name: Create GitHub Release (signed only)
        if: steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('catalog-draft-{0}', github.sha) }}
          name: Catalog ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          body: |
            Signed Nova-Store catalog release `${{ github.ref_type == 'tag' && github.ref_name || github.sha }}`.

            **Nova client assets** (required):
            - `store-catalog.toml`
            - `store-catalog.toml.minisig`

            Also attached: `catalog.json` (+ `.minisig`) aggregate for tooling.

            Nova fetches `releases/latest/download/store-catalog.toml(.minisig)`,
            verifies with the pinned minisign public key, then applies — or keeps
            the last trusted / embedded catalog on failure.
            See `docs/catalog-signing.md` and `docs/nova-consumption.md`.
          files: |
            dist/store-catalog.toml
            dist/store-catalog.toml.minisig
            dist/catalog.json
            dist/catalog.json.minisig
          fail_on_unmatched_files: true
          make_latest: true
