id = "actionlint"
name = "actionlint"
description = "GitHub Actions workflow dosyaları için statik denetleyici."
category = "development"
source = "https://github.com/rhysd/actionlint"
license = "MIT"
executable = "actionlint"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "elevated"
trust_class = "A"
install_command = ["sudo", "pacman", "-S", "--noconfirm", "actionlint"]
install_notes = """
pacman: sudo pacman -S actionlint
go: go install github.com/rhysd/actionlint/cmd/actionlint@latest
brew: brew install actionlint
Resmî: https://github.com/rhysd/actionlint
"""
