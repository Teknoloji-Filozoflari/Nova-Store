id = "distrobox"
name = "distrobox"
description = "Herhangi bir Linux dağıtımını terminalde kullanmayı sağlar."
category = "containers"
source = "https://github.com/89luca89/distrobox"
license = "GPL-3.0-only"
executable = "distrobox"
install_method = "pacman"
supported_platforms = ["linux-x64", "linux-aarch64"]
privilege = "elevated"
trust_class = "A"
install_command = ["sudo", "pacman", "-S", "--noconfirm", "distrobox"]
install_notes = """
pacman: sudo pacman -S distrobox
brew: brew install distrobox
Resmî: https://distrobox.it/
"""

[release]
repo = "89luca89/distrobox"
